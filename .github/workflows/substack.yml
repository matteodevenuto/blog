name: Sync Substack Posts

on:
  schedule:
    - cron: "0 */2 * * *"  # Runs every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: pip install feedparser requests beautifulsoup4  # Added beautifulsoup4
      - name: Fetch Substack posts
        run: python scripts/fetch_substack.py
      - name: Commit new posts
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add content/blog/*
          if git diff-index --quiet HEAD --; then
            echo "No new posts to commit"
          else
            git commit -m "Sync Substack posts"
            git push origin main  # Replace with your branch
          fi

name: Sync Substack Posts

on:
  schedule:
    - cron: "*/5 * * * *"  # Runs every 5 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Needed to commit to repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Sync Substack Posts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs').promises;
            const path = require('path');
            const fetch = require('node-fetch');

            // Substack RSS feed URL
            const rssUrl = 'https://matteodevenuto.substack.com/feed';
            // Fetch RSS feed
            const response = await fetch(rssUrl);
            const rssText = await response.text();

            // Simple XML parsing (using regex for brevity; could use xml2js for robustness)
            const items = rssText.match(/<item>[\s\S]*?<\/item>/g) || [];
            const outputDir = 'content/blog';
            await fs.mkdir(outputDir, { recursive: true });

            for (const item of items) {
              const titleMatch = item.match(/<title>(.*?)<\/title>/);
              const linkMatch = item.match(/<link>(.*?)<\/link>/);
              const dateMatch = item.match(/<pubDate>(.*?)<\/pubDate>/);
              const contentMatch = item.match(/<content:encoded><!\[CDATA\[(.*?)\]\]><\/content:encoded>/s) || 
                                 item.match(/<description>(.*?)<\/description>/s);

              if (!titleMatch || !linkMatch || !dateMatch || !contentMatch) continue;

              const title = titleMatch[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
              const slug = linkMatch[1].split('/').pop();
              const date = new Date(dateMatch[1]).toISOString();
              const content = contentMatch[1].replace(/<!\[CDATA\[(.*?)\]\]>/s, '$1');

              const frontmatter = `---
title: "${title}"
date: ${date}
author: "Matteo De Venuto"
draft: false
---
`;
              const filename = `${date.split('T')[0]}-${slug}.md`;
              const filepath = path.join(outputDir, filename);

              // Write file if it doesn’t exist
              try {
                await fs.access(filepath);
                console.log(`Skipped ${filename} (already exists)`);
              } catch {
                await fs.writeFile(filepath, frontmatter + content);
                console.log(`Created ${filename}`);
              }
            }

      - name: Commit new posts
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add content/blog/*
          git commit -m "Sync Substack posts" || echo "No changes"
          git push

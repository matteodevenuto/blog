name: Sync Substack Posts

on:
  schedule:
    - cron: "*/5 * * * *"  # Runs every 5 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Needed to commit to repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Fetch Substack posts
        run: python scripts/fetch_substack.py

      - name: Commit new posts
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add content/blog/*
          git commit -m "Sync Substack posts" || echo "No changes"
          git push

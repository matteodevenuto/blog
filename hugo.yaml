baseURL: https://matteodevenuto.com/
title: "Matteo De Venuto"
languageCode: en-us
theme: ["PaperMod"]

services:
  googleAnalytics:
    id: "G-HTCFBM9VNG"

outputs:
  home: ["HTML"]
  section: ["HTML", "RSS"]

outputFormats:
  RSS:
    mediatype: "application/rss+xml"
    baseName: "rss"

permalinks:
  blog: "/blog/:slug"
  rss: "blog/rss"

params:
  profileMode:
    enabled: true
    title: "Matteo De Venuto" # optional default will be site title
    imageUrl: "/images/profile.jpg" # optional
    imageTitle: "Profile Picture" # optional
    imageWidth: 220 # custom size
    imageHeight: 220 # custom size
    buttons:
      - name: Blog
        url: "/blog"
     
  disableThemeToggle: false
  ShowCodeCopyButtons: true

  ShowFullTextinRSS: true

  assets:
    favicon: "/images/favicon.png"

  socialIcons:
    - name: "X"
      url: "https://x.com/matteodevenuto"
    - name: "GitHub"
      url: "https://github.com/matteodevenuto"
    - name: "Instagram"
      url: "https://instagram.com/matteodevenuto"
    - name: "YouTube"
      url: "https://youtube.com/matteodevenuto"
    - name: "email"
      url: "mailto:blog@matteodevenuto.com"
    - name: "rss"
      url: "https://matteodevenuto.substack.com/feed"
